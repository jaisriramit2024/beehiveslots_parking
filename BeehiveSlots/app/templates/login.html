{% extends "layout.html" %}

{% block content %}
<div class="form-container" style="max-width: 900px;">
    <div class="split-layout">

        <!-- Left branding -->
        <div class="split-left">
            <h2>Welcome back<br>to the hive 🍯</h2>
            <p style="color:rgba(255,255,255,0.55); font-size:0.95rem; margin-top:0.5rem;">
                Sign in to manage your parking spaces or find your perfect spot.
            </p>
        </div>

        <!-- Form -->
        <div class="glass-panel" style="padding: 2.5rem;">
            <form method="POST" style="background: transparent; box-shadow: none; padding: 0;">
                <div class="form-group">
                    <label for="name">Username</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., John Doe">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Your password">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                No account yet?
                <a href="/register/owner" style="color: var(--primary);">Join as Owner</a>
                &nbsp;·&nbsp;
                <a href="/register/parker" style="color: var(--primary);">Join as Parker</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
