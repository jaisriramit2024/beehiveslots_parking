{% extends "layout.html" %}

{% block content %}
<div class="form-container" style="max-width: 900px;">
    <div class="split-layout">

        <!-- Left Side: Illustration & Welcome Text -->
        <div class="split-left">
            <h2>Start Sharing<br>Your Space</h2>
            <img src="{{ url_for('static', filename='bee-owner.svg') }}" alt="Bee Illustration"
                style="max-width: 200px;">
        </div>

        <!-- Right Side: The Form -->
        <div class="glass-panel" style="padding: 2.5rem;">
            <form action="/register/owner" method="POST" style="background: transparent; box-shadow: none; padding: 0;">
                <input type="hidden" name="role" value="Owner">

                <div class="form-group">
                    <label for="name">What should we call you?</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="password">Choose a password</label>
                    <input type="password" id="password" name="password" required placeholder="Make it strong!">
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Join Beehive as an
                    Owner</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="/login" style="color: var(--primary);">Login</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
