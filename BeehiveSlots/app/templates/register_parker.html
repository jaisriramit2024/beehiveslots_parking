{% extends "layout.html" %}

{% block content %}
<div class="form-container" style="max-width: 900px;">
    <div class="split-layout">

        <!-- Left Side: Illustration & Welcome Text -->
        <div class="split-left">
            <h2>Ready to park?</h2>
            <img src="{{ url_for('static', filename='bee-parker.svg') }}" alt="Bee Illustration"
                style="max-width: 200px;">
        </div>

        <!-- Right Side: The Form -->
        <div class="glass-panel" style="padding: 2.5rem;">
            <form action="/register/parker" method="POST"
                style="background: transparent; box-shadow: none; padding: 0;">
                <input type="hidden" name="role" value="Driver">

                <div class="form-group">
                    <label for="name">What should we call you?</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., Jane Smith">
                </div>

                <div class="form-group">
                    <label for="registration">What's your vehicle number?</label>
                    <input type="text" id="registration" name="registration" required placeholder="e.g., MH 04 AB 1234">
                </div>

                <div class="form-group">
                    <label for="license">License Details</label>
                    <input type="text" id="license" name="license" required placeholder="e.g., DL-1420110012345">
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Create My Parker
                    Account</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="/login" style="color: var(--primary);">Login</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
